name: ci

# Linux is where this project's durability claims mean anything, so Linux is
# what the badge is about. The Windows job runs the same suite and is allowed
# to be informative rather than authoritative: directory fsync does not exist
# there, so the case that checks it reports BLOCKED and the crash corpus is
# testing a different set of kernel behaviours.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: what this build actually guarantees
        run: go run ./crashtest/cmd/crashrepro -seed 1

      - name: vet
        run: go vet ./...

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # The whole suite, including the full recorded crash corpus. -v so the
      # measured numbers docs/verification.md quotes - corpus size, kill-point
      # spread, recovery shapes, how often the broken build was caught -
      # are in the log rather than only in a claim.
      - name: test
        run: go test -v -count=1 -timeout 20m ./...

      # A 32-bit build, executed rather than merely compiled, because the bug
      # this catches only exists where int is 32 bits: record.go reads an
      # on-disk uint32 length field, and converting it to int before bounding
      # it made a corrupt length negative and the slice bound that followed
      # negative with it. TestAbsurdLengthFieldIsATornTail had been failing
      # under GOARCH=386 since it was written, unrun, until 29145d4.
      #
      # Windows only, and that is a real limit rather than a preference. A
      # windows/amd64 runner executes a 386 binary directly; running a linux/386
      # binary on the ubuntu runner needs ia32 support this repository has not
      # verified, and a CI step whose green has not been observed is the thing
      # this project exists to argue against. Root package only: it is the one
      # with the decoder in it, and nothing here forks a child.
      - name: 32-bit build, root package
        if: matrix.os == 'windows-latest'
        env:
          GOARCH: "386"
        run: go test -count=1 -timeout 10m ./

      # The distribution docs/verification.md quotes: not how many times it ran,
      # but where the kills actually landed. Linux and Windows should differ
      # here, and the point of printing it is that a reader can check.
      - name: where the kills landed
        run: go run ./crashtest/cmd/crashrepro -corpus-shapes

      # A failing seed preserves the directory the dead process left behind.
      # Those bytes replay to the identical failure with one command, so they
      # are worth more than the log line that reported them.
      - name: upload preserved crash cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-failures-${{ matrix.os }}
          path: crash-failures/
          if-no-files-found: ignore
          retention-days: 14

  race:
    name: race detector (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The store is shared across goroutines by any real caller, and
      # TestConcurrentWritersAllSurvive hammers the map, the counters and the
      # log's sequence and checksum state from eight of them at once. That is
      # where a data race in this package could hide, and it is what this job
      # is for.
      - name: test -race
        run: go test -race -count=1 -timeout 15m ./

      # Deliberately a subset of the corpus. Race instrumentation makes every
      # child several times slower, and 240 instrumented children buys almost
      # nothing over 40: each seed forks the same code down the same path, so
      # the interesting concurrency here is the harness's own worker pool
      # rather than anything the seed varies. The full corpus runs uninstrumented
      # in the test job above.
      - name: test -race over part of the corpus
        run: go test -race -count=1 -timeout 15m -run 'TestKillPointsAreSpread|TestCrashCorpusRecoveryIsDeterministic|TestCorpusSizeFloor' ./crashtest/

  bench:
    name: benchmark (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Not a regression gate - a shared CI runner's fsync latency is not
      # stable enough to gate on, and pretending otherwise would produce a
      # flaky red that people learn to ignore. This proves the harness still
      # runs and puts a Linux set of numbers in the log next to the Windows
      # ones committed in bench/results.md.
      - name: run the benchmark harness
        run: |
          go run ./bench \
            -repeats 1 \
            -machine "GitHub Actions ubuntu-latest runner" \
            -kernel "$(uname -sr)" \
            -fs "$(findmnt -no FSTYPE --target "$RUNNER_TEMP")" \
            -flush-honoured "unknown - virtualised storage on a shared runner"
